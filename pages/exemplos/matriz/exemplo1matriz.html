<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../../../css/exemplos.css">
    <script src="../../../js/script.js"></script>
    <title>Exemplo 1 - Matrizes</title>
</head>

<body>
    <div class="example-shell">
        <nav class="example-topbar">
            <div>
                <div class="example-kicker">Matrizes</div>
                <h1>Matrizes - Exemplo 1</h1>
            </div>
            <div class="example-actions">
                <button class="btn-secondary" onclick="window.location.href='../../matriz.html'">Voltar</button>
                <button onclick="abrirModal()">Ver código fonte</button>
            </div>
        </nav>

        <main class="example-main">
            <section class="example-hero">
                <span class="example-badge">Laboratório</span>
                <h2>Preencher e listar uma matriz</h2>
                <p>Os valores são solicitados por prompt e organizados em uma matriz 2x2.</p>
            </section>

            <section class="example-grid">
                <article class="example-card">
                    <h3>Ação</h3>
                    <p>Clique para preencher a matriz e visualizar o resultado final.</p>
                    <button onclick="validarMatriz()">Iniciar</button>
                </article>

                <article class="example-card result-card">
                    <h3>Resultado</h3>
                    <div id="resultado" class="matrix-output">Aguardando interação...</div>
                </article>
            </section>
        </main>

        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="fecharModal()">&times;</span>
                <h3>Código Fonte</h3>
                <pre id="codigo"></pre>
            </div>
        </div>
    </div>

    <script>
        function validarMatriz() {
            let linha,
                coluna;

            let matriz = [
                [],
                []
            ];

            let tela = document.getElementById("resultado")
            let resultado = ""

            for (linha = 0; linha < 2; linha++) {
                for (coluna = 0; coluna < 2; coluna++) {
                    matriz[linha][coluna] = parseInt(prompt("Digite o valor da posição [" + linha + "][" + coluna + "]:"))
                }
            }

            for (linha = 0; linha < 2; linha++) {

                for (coluna = 0; coluna < 2; coluna++) {
                    resultado += matriz[linha][coluna] + " "
                }
                resultado += "<br>"
            }

            tela.innerHTML = resultado;
        }
    </script>
</body>

</html>
