<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../../../css/exemplos.css">
    <script src="../../../js/script.js"></script>
    <title>Tabuada com For</title>
</head>

<body>
    <div class="example-shell">
        <nav class="example-topbar">
            <div>
                <div class="example-kicker">Estruturas de Repetição</div>
                <h1>For - Exemplo 1</h1>
            </div>
            <div class="example-actions">
                <button class="btn-secondary" onclick="window.location.href='../../repeticao.html'">Voltar</button>
                <button onclick="abrirModal()">Ver código fonte</button>
            </div>
        </nav>

        <main class="example-main">
            <section class="example-hero">
                <span class="example-badge">Laboratório</span>
                <h2>Gerar Tabuada</h2>
                <p>Digite um número inteiro positivo para montar a tabuada de 1 a 10.</p>
            </section>

            <section class="example-grid">
                <article class="example-card">
                    <h3>Entrada</h3>
                    <label for="numero">Número</label>
                    <div class="example-form-row">
                        <input type="number" id="numero" placeholder="Digite um número inteiro positivo" min="1" step="1">
                        <button onclick="gerarTabuada()">Gerar tabuada</button>
                    </div>
                </article>

                <article class="example-card result-card">
                    <h3>Resultado</h3>
                    <div id="resultado" class="result-output">A tabuada aparecerá aqui.</div>
                </article>
            </section>
        </main>

        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="fecharModal()">&times;</span>
                <h3>Código Fonte</h3>
                <pre id="codigo"></pre>
            </div>
        </div>
    </div>


    <script>
        function gerarTabuada() {
            let numero = document.getElementById("numero").value;

            if (numero === "") {
                document.getElementById("resultado").innerText = "Digite um número inteiro positivo!";
                return;
            }

            numero = parseInt(numero);

            if (isNaN(numero) || numero <= 0) {
                document.getElementById("resultado").innerText = "Digite um número inteiro positivo válido!";
                return;
            }

            let tabuada = "";

            for (let contador = 1; contador <= 10; contador++) {
                tabuada += numero + " x " + contador + " = " + (numero * contador) + "<br>";
            }

            document.getElementById("resultado").innerHTML = tabuada;
        }

    </script>

</body>

</html>
