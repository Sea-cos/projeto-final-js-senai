<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../../../css/exemplos.css">
    <script src="../../../js/script.js"></script>
    <title>Exemplo 2 - Vetores</title>
</head>

<body>
    <div class="example-shell">
        <nav class="example-topbar">
            <div>
                <div class="example-kicker">Vetores</div>
                <h1>Vetores - Exemplo 2</h1>
            </div>
            <div class="example-actions">
                <button class="btn-secondary" onclick="window.location.href='../../vetor.html'">Voltar</button>
                <button onclick="abrirModal()">Ver código fonte</button>
            </div>
        </nav>

        <main class="example-main">
            <section class="example-hero">
                <span class="example-badge">Laboratório</span>
                <h2>Localizar menor e maior número</h2>
                <p>O exercício pede oito números via prompt e exibe o vetor final com os extremos.</p>
            </section>

            <section class="example-grid">
                <article class="example-card">
                    <h3>Ação</h3>
                    <p>Este exemplo usa prompts do navegador para preencher o vetor e calcular os valores.</p>
                    <button onclick="validarVetor()">Iniciar</button>
                </article>

                <article class="example-card result-card">
                    <h3>Resultado</h3>
                    <div id="resultado" class="result-output">Aguardando interação...</div>
                </article>
            </section>
        </main>

        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="fecharModal()">&times;</span>
                <h3>Código Fonte</h3>
                <pre id="codigo"></pre>
            </div>
        </div>
    </div>

    <script>
        function validarVetor() {

            let numeros = new Array(8);
            let maiorNum;
            let menorNum;

            for (let i = 0; i < numeros.length; i++) {
                numeros[i] = parseInt(prompt("Insira o " + (i + 1) + " número: "))

                if (i === 0) {
                    maiorNum = numeros[0]
                    menorNum = numeros[0]
                }

                if (numeros[i] > maiorNum) {
                    maiorNum = numeros[i]
                } else if (numeros[i] < menorNum) {
                    menorNum = numeros[i]
                }
            }

            document.getElementById("resultado").innerHTML =
                "Vetor: " + numeros +
                "<br> Maior número: " + maiorNum +
                "<br> Menor número: " + menorNum
        }
    </script>
</body>

</html>
