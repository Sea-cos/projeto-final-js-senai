<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../../../css/exemplos.css">
    <script src="../../../js/script.js"></script>
    <title>Exemplo 1 - While</title>
</head>

<body>
    <div class="example-shell">
        <nav class="example-topbar">
            <div>
                <div class="example-kicker">Estruturas de Repetição</div>
                <h1>While - Exemplo 1</h1>
            </div>
            <div class="example-actions">
                <button class="btn-secondary" onclick="window.location.href='../../repeticao.html'">Voltar</button>
                <button onclick="abrirModal()">Ver código fonte</button>
            </div>
        </nav>

        <main class="example-main">
            <section class="example-hero">
                <span class="example-badge">Laboratório</span>
                <h2>Repetição de Números</h2>
                <p>Insira números até digitar 0 para encerrar a soma acumulada.</p>
            </section>

            <section class="example-grid">
                <article class="example-card">
                    <h3>Ação</h3>
                    <p>Este exercício usa prompts para repetir a entrada até que o valor de parada seja informado.</p>
                    <button onclick="repeticaoNumero()">Iniciar</button>
                </article>

                <article class="example-card result-card">
                    <h3>Resultado</h3>
                    <div id="resultado" class="result-output">Aguardando interação...</div>
                </article>
            </section>
        </main>

        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="fecharModal()">&times;</span>
                <h3>Código Fonte</h3>
                <pre id="codigo"></pre>
            </div>
        </div>
    </div>


    <script>
        function repeticaoNumero() {
            let numero = parseInt(prompt("Insira um número: "));
            let soma = 0;
            let contador = 0;

            while (numero !== 0) {
                soma += numero;
                contador++;

                numero = parseInt(prompt("Insira um número: "))
            }

            document.getElementById("resultado").innerText = "Soma total: " + soma + "\nNúmeros inseridos: " + contador

        }
    </script>

</body>

</html>
