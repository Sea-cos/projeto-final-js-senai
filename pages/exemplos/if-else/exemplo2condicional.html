<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../../../css/exemplos.css">
    <script src="../../../js/script.js"></script>
    <title>Situação do Aluno</title>
</head>

<body>


    <nav>
        <h2>If..else - Exemplo 2</h2>
        <div>
            <button onclick="abrirModal()">Ver código fonte</button><button
                onclick="window.location.href='../../condicional.html'">Voltar</button>
        </div>
    </nav>



    <h2>Calcular Média e Situação do Aluno</h2>

    <input type="number" id="nota1" placeholder="Digite a primeira nota">
    <input type="number" id="nota2" placeholder="Digite a segunda nota">
    <input type="number" id="nota3" placeholder="Digite a terceira nota">
    <button onclick="calcularMedia()">Calcular</button>

    <div id="resultado"></div>


    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <h3>Código Fonte</h3>
            <pre id="codigo"></pre>
        </div>
    </div>


    <script>
        function calcularMedia() {
            let nota1 = document.getElementById("nota1").value;
            let nota2 = document.getElementById("nota2").value;
            let nota3 = document.getElementById("nota3").value;

            if (nota1 === "" || nota2 === "" || nota3 === "") {
                document.getElementById("resultado").innerText = "Digite todos os números!";
            } else {
                nota1 = parseFloat(nota1);
                nota2 = parseFloat(nota2);
                nota3 = parseFloat(nota3);

                let media = (nota1 + nota2 + nota3) / 3;
                let situacao = "";

                if (media >= 7.0) {
                    situacao = "APROVADO";
                } else if (media >= 5.0) {
                    situacao = "RECUPERAÇÃO";
                } else {
                    situacao = "REPROVADO";
                }

                document.getElementById("resultado").innerHTML =
                    "<strong>Média: " + media.toFixed(2) + "</strong><br>" +
                    "<strong>Situação: " + situacao + "</strong>";
            }
        }
    </script>

</body>

</html>
