<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/css/exemplos.css">
    <script src="/js/script.js"></script>
    <title>Calculadora com Switch</title>
</head>

<body>


    <nav>
        <h2>Switch..case - Exemplo 2</h2>
        <div>
            <button onclick="abrirModal()">Ver código fonte</button><button
                onclick="window.location.href='../../condicional.html'">Voltar</button>
        </div>
    </nav>



    <h2>Operações com Dois Números</h2>

    <input type="number" id="numero1" placeholder="Digite o primeiro número" step="any">
    <input type="number" id="numero2" placeholder="Digite o segundo número" step="any">

    <select id="operacao">
        <option value="">Escolha a operação</option>
        <option value="soma">Soma (+)</option>
        <option value="subtracao">Subtração (-)</option>
        <option value="multiplicacao">Multiplicação (×)</option>
        <option value="divisao">Divisão (÷)</option>
    </select>

    <button onclick="calcular()">Calcular</button>

    <div id="resultado"></div>


    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <h3>Código Fonte</h3>
            <pre id="codigo"></pre>
        </div>
    </div>


    <script>
        function calcular() {
            let numero1 = document.getElementById("numero1").value;
            let numero2 = document.getElementById("numero2").value;
            const operacao = document.getElementById("operacao").value;

            if (numero1 === "" || numero2 === "") {
                document.getElementById("resultado").innerText = "Digite os dois números!";
                return;
            }

            if (operacao === "") {
                document.getElementById("resultado").innerText = "Escolha uma operação!";
                return;
            }

            numero1 = parseFloat(numero1);
            numero2 = parseFloat(numero2);

            if (isNaN(numero1) || isNaN(numero2)) {
                document.getElementById("resultado").innerText = "Digite números válidos!";
                return;
            }

            let resultado;
            let nomeOperacao;

            switch (operacao) {
                case "soma":
                    resultado = numero1 + numero2;
                    nomeOperacao = "Soma";
                    break;
                case "subtracao":
                    resultado = numero1 - numero2;
                    nomeOperacao = "Subtração";
                    break;
                case "multiplicacao":
                    resultado = numero1 * numero2;
                    nomeOperacao = "Multiplicação";
                    break;
                case "divisao":
                    if (numero2 === 0) {
                        document.getElementById("resultado").innerText = "Não é possível dividir por zero!";
                        return;
                    }
                    resultado = numero1 / numero2;
                    nomeOperacao = "Divisão";
                    break;
                default:
                    document.getElementById("resultado").innerText = "Operação inválida!";
                    return;
            }

            let parOuImpar;

            switch (resultado % 2) {
                case 0:
                    parOuImpar = "Par";
                    break;
                default:
                    parOuImpar = "Ímpar";
            }

            document.getElementById("resultado").innerText =
                "Operação escolhida: " + nomeOperacao +
                " | Números: " + numero1 + " e " + numero2 +
                " | Resultado: " + resultado +
                " | Classificação: " + parOuImpar;
        }
    </script>

</body>

</html>
